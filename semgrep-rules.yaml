rules:
  - id: python-eval
    pattern: eval(...)
    message: "Dangerous func eval(). Potential RCE"
    languages: [python]
    severity: ERROR

  - id: python-shell-true
    pattern: subprocess.run(..., shell=True)
    message: "Dangerous func subprocess.run(). Potential RCE"
    languages: [python]
    severity: WARNING

  - id: hardcoded-password
    patterns:
      - pattern-either:
          - pattern: password = "..."
          - pattern: token = "..."
          - pattern: passwd = "..."
    message: "Hardcoded password/token"
    languages: [python]
    severity: ERROR

  - id: python-os-system
    pattern: os.system(...)
    message: "Dangerous func os.system(). Potential RCE"
    languages: [python]
    severity: WARNING

  - id: python-db-execute
    pattern: db.execute(...)
    message: "Dangerous func db.execute(...). Potential RCE/SQLi"
    languages: [python]
    severity: WARNING
